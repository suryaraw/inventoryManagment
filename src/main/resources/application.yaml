# Default configuration (applies to all profiles)
spring:
  application:
    name: inventoryManagement
  profiles:
    active: manish   # default active profile

mvc:
  view:
    prefix: /WEB-INF/jsp/
    suffix: .jsp	

# Common actuator settings
management:
  endpoints:
    web:
      exposure:
        include: "*"  # expose all endpoints
  metrics:
    export:
      simple:
        enabled: true
logging:
  level:
    org.springframework: INFO

---

# Manish profile
spring:
  config:
    activate:
      on-profile: manish
  datasource:
    url: jdbc:mysql://localhost:3306/inventorydb
    username: root
    password: maniSH@1430
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    org.springframework: DEBUG

